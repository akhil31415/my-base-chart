{{- $globalIngress := include "globalIngress" . | fromYaml }}
{{- $globalApp := include "globalApp" . | fromYaml }}
{{- if $globalIngress.enabled }}
{{- $annotations := dict }}
{{- if .Values.ingress.aws.annotations }}
  {{- $annotations = merge $annotations .Values.ingress.aws.annotations }}
{{- end }}
{{- if .Values.ingress.azure.annotations }}
  {{- $annotations = merge $annotations .Values.ingress.azure.annotations }}
{{- end }}
{{- if .Values.ingress.gcp.annotations }}
  {{- $annotations = merge $annotations .Values.ingress.gcp.annotations }}
{{- end }}
{{- if .Values.ingress.annotations }}
  {{- $annotations = merge $annotations .Values.ingress.annotations }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fullname" . }}-ingress
  namespace: {{ $globalApp.namespace }}
  labels:
    {{- include "commonLabels" . | nindent 4 }}
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
  {{- toYaml .Values.ingress.tls | nindent 2 }}
  {{- end }}
  rules:
  - host: {{ tpl .Values.ingress.hostname . }}
    http:
      paths:
      - path: {{ .Values.ingress.path }}
        pathType: {{ .Values.ingress.pathType }}
        backend:
          service:
            name: {{ include "fullname" . }}
            port:
              number: {{ .Values.service.port }}
      {{- range .Values.ingress.extraPaths }}
      - path: {{ .path }}
        pathType: {{ .pathType | default "Prefix" }}
        backend:
          service:
            name: {{ .serviceName | default (include "fullname" $) }}
            port:
              number: {{ .port }}
      {{- end }}
  {{- range .Values.ingress.extraRules }}
  - host: {{ tpl .host $ }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType | default "Prefix" }}
        backend:
          service:
            name: {{ .serviceName | default (include "fullname" $) }}
            port:
              number: {{ .port }}
      {{- end }}
  {{- end }}
{{- end }}