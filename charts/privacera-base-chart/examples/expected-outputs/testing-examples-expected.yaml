apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-service-netpol
  namespace: privacera-test
  labels:
    app: test-service
    app.kubernetes.io/name: test-service
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: test-service
    app.kubernetes.io/part-of: test-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 0.1.0-test
spec:
  podSelector:
    matchLabels:
      app: test-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: privacera-test
    ports:
    - port: 8080
      protocol: TCP
  egress:
  - ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
    to: []
