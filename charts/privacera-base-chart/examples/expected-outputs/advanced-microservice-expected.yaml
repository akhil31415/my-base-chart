# Source: privacera-base-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: privacera
  labels:
    app: analytics-service
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: analytics-service
    app.kubernetes.io/part-of: analytics-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.5.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        backup-required: "true"
        data-classification: sensitive
        service-type: analytics
        team: data-platform
    spec:
      
      imagePullSecrets:
        - name: map[name:privacera-registry-secret]
      serviceAccountName: analytics-service-sa
      tolerations:
        []
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: analytics-service
      securityContext:
        enabled: true
        fsGroup: 200
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: analytics-service
        image: "404161567772.dkr.ecr.us-east-1.amazonaws.com/privacera/analytics-service:v1.5.0"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        ports:
        - name: http
          containerPort: 5959
          protocol: TCP
        resources:
          enabled: true
          limits:
            cpu: ""
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 2Gi
        
        
        
        
        volumeMounts:
      restartPolicy: Always
      volumes:
---
# Source: privacera-base-chart/templates/scaled-object.yaml
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service
  namespace: privacera
  labels:
    app: analytics-service
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: analytics-service
    app.kubernetes.io/part-of: analytics-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.5.0
spec:
  scaleTargetRef:
    name: analytics-service
    apiVersion: apps/v1
    kind: Deployment
  pollingInterval: 30
  cooldownPeriod: 300
  idleReplicaCount: 1
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
  - metadata:
      bootstrapServers: kafka-cluster:9092
      consumerGroup: analytics-consumer
      lagThreshold: "100"
      topic: analytics-events
    type: kafka
  - metadata:
      metricName: analytics_queue_depth
      query: sum(analytics_queue_depth)
      serverAddress: http://prometheus:9090
      threshold: "50"
    type: prometheus
