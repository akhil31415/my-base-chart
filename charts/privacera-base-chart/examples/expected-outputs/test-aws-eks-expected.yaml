apiVersion: v1
kind: Service
metadata:
  name: test-aws
  namespace: privacera
  labels:
    app: test-aws
    app.kubernetes.io/name: test-aws
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: test-aws
    app.kubernetes.io/part-of: test-aws
