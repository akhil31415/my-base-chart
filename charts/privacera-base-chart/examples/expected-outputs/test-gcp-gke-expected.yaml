---
# Source: privacera-base-chart/templates/service-account.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-gcp-sa
  namespace: privacera
  labels:
    app: test-gcp
    app.kubernetes.io/name: test-gcp
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: test-gcp
    app.kubernetes.io/part-of: test-gcp
    app.kubernetes.io/managed-by: Helm
  annotations:
    iam.gke.io/gcp-service-account: test-gcp@my-project.iam.gserviceaccount.com
---
# Source: privacera-base-chart/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: test-gcp
  namespace: privacera
  labels:
    app: test-gcp
    app.kubernetes.io/name: test-gcp
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: test-gcp
    app.kubernetes.io/part-of: test-gcp
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5959
      protocol: TCP
