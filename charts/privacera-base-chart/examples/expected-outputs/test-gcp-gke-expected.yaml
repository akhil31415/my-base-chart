  selector:
    app: test-gcp
---
# Source: privacera-base-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-gcp
  namespace: privacera
  labels:
    app: test-gcp
    app.kubernetes.io/name: test-gcp
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: test-gcp
    app.kubernetes.io/part-of: test-gcp
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: test-gcp
  template:
    metadata:
      labels:
        app: test-gcp
    spec:
      
      serviceAccountName: test-gcp-sa
      tolerations:
        []
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: test-gcp
      securityContext:
        enabled: true
        fsGroup: 200
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: test-gcp
        image: "docker.io/nginx:1.23"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          enabled: true
          limits:
            cpu: ""
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 2Gi
        
        
        
        
        volumeMounts:
      restartPolicy: Always
      volumes:
---
# Source: privacera-base-chart/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-gcp-ingress
  namespace: privacera
  labels:
    app: test-gcp
    app.kubernetes.io/name: test-gcp
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: test-gcp
    app.kubernetes.io/part-of: test-gcp
    app.kubernetes.io/managed-by: Helm
  ingressClassName: gce
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: test-example-com-ip
    networking.gke.io/managed-certificates: test-example-com-cert
spec:
  rules:
  - host: test.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-gcp
            port:
              number: 80
