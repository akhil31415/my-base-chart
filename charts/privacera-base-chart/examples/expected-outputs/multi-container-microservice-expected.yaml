---
# Source: privacera-base-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: privacera
  labels:
    app: payment-service
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: payment-service
    app.kubernetes.io/part-of: payment-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.3.0
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        architecture: multi-container
        service-type: api
        team: commerce
    spec:
      
      imagePullSecrets:
        - name: map[name:privacera-registry-secret]
      serviceAccountName: payment-service-sa
      tolerations:
        []
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: payment-service
      securityContext:
        enabled: true
        fsGroup: 200
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: payment-service
        image: "404161567772.dkr.ecr.us-east-1.amazonaws.com/privacera/payment-service:v1.3.0-staging"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        ports:
        - name: http
          containerPort: 5959
          protocol: TCP
        resources:
          enabled: true
          limits:
            cpu: ""
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 2Gi
        
        
        
        
        volumeMounts:
      restartPolicy: Always
      volumes:
---
# Source: privacera-base-chart/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
  namespace: privacera
  labels:
    app: payment-service
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: payment-service
    app.kubernetes.io/part-of: payment-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.3.0
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 1
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
