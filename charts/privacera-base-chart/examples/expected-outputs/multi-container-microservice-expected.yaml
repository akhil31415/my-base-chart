# Source: privacera-base-chart/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-service-netpol
  namespace: privacera
  labels:
    app: payment-service
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: payment-service
    app.kubernetes.io/part-of: payment-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.3.0
spec:
  podSelector:
    matchLabels:
      app: payment-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: privacera
    ports:
    - port: 80
      protocol: TCP
  egress:
  - ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
    to: []
