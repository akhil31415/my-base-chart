# Source: privacera-base-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: privacera
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: order-service
    app.kubernetes.io/part-of: order-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 2.1.0
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        cost-center: engineering
        criticality: high
        service-type: api
        team: commerce
      annotations:
        deployment.kubernetes.io/revision: "3"
        service.mesh/inject: "true"
    spec:
      
      imagePullSecrets:
        - name: map[name:privacera-registry-secret]
      serviceAccountName: order-service-sa
      tolerations:
        []
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: order-service
      securityContext:
        enabled: true
        fsGroup: 200
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: order-service
        image: "404161567772.dkr.ecr.us-east-1.amazonaws.com/privacera/order-service:v2.1.0-prod"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        ports:
        - name: http
          containerPort: 5959
          protocol: TCP
        resources:
          enabled: true
          limits:
            cpu: ""
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 2Gi
        
        
        
        
        volumeMounts:
      restartPolicy: Always
      volumes:
---
# Source: privacera-base-chart/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: privacera
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: order-service
    app.kubernetes.io/part-of: order-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 2.1.0
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 1
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 60
        type: Percent
        value: 50
      - periodSeconds: 60
        type: Pods
        value: 2
      selectPolicy: Min
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 30
        type: Percent
        value: 100
      - periodSeconds: 30
        type: Pods
        value: 2
      selectPolicy: Max
      stabilizationWindowSeconds: 60
---
# Source: privacera-base-chart/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service-ingress
  namespace: privacera
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: order-service
    app.kubernetes.io/part-of: order-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 2.1.0
spec:
  rules:
  - host: api.privacera.com
    http:
      paths:
      - path: /api/v1/orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8080
