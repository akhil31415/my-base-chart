# Source: privacera-base-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-database
  namespace: privacera
  labels:
    app: app-name
    app.kubernetes.io/name: app-name
    app.kubernetes.io/instance: test-app
    app.kubernetes.io/component: app-name
    app.kubernetes.io/part-of: app-name
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: app-name
  template:
    metadata:
      labels:
        app: app-name
    spec:
      
      serviceAccountName: postgres-database-sa
      nodeSelector:
        node.kubernetes.io/instance-type: r5.xlarge
        topology.kubernetes.io/zone: us-west-2a
      tolerations:
        - effect: NoSchedule
          key: database
          operator: Equal
          value: postgres
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: app-name
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: app-name
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - r5.xlarge
                - r5.2xlarge
            weight: 100
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: postgres-database
            topologyKey: kubernetes.io/hostname
      securityContext:
        enabled: true
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: false
        runAsUser: 999
      initContainers:
      - name: init-db
        image: postgres:15.2
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
          - -c
          - |
            set -e
            echo "Initializing database directories..."
          
            # Create data directory if it doesn't exist
            if [ ! -d "/data/postgres-data/pgdata" ]; then
              echo "Creating PostgreSQL data directory structure..."
              mkdir -p /data/postgres-data/pgdata
              mkdir -p /data/postgres-wal
              chown -R 999:999 /data/postgres-data
              chown -R 999:999 /data/postgres-wal
            fi
          
            echo "Database initialization completed."
        volumeMounts:
          - mountPath: /data/postgres-data
            name: postgres-data
          - mountPath: /data/postgres-wal
            name: postgres-wal
        securityContext:
          capabilities:
            add:
            - CHOWN
            - FOWNER
          runAsGroup: 0
          runAsUser: 0
      containers:
      - name: app-name
        image: "postgres/postgres:15.2"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 999
          runAsNonRoot: false
          runAsUser: 999
        ports:
        - name: http
          containerPort: 5432
          protocol: TCP
        envFrom:
          - secretRef:
              name: postgres-database
        resources:
          enabled: true
          limits:
            cpu: ""
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 2Gi
        
        
        
        
        volumeMounts:
      restartPolicy: Always
      volumes:
