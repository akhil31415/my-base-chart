name: Test Helm Charts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/test-charts.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/test-charts.yml'
  workflow_dispatch:

jobs:
  test-all-examples:
    name: Test All Example Files
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.4
    
    - name: Test each example file
      run: |
        echo "🧪 Testing all example files..."
        echo ""
        
        PASSED=0
        FAILED=0
        SKIPPED=0
        
        for example in ./charts/privacera-base-chart/examples/*.yaml; do
          # Skip docs only
          if [[ "$example" == *"README.md" ]] || [[ "$example" == *"TESTING.md" ]]; then
            SKIPPED=$((SKIPPED + 1))
            continue
          fi
          
          filename=$(basename "$example")
          echo "📦 Testing: $filename"
          
          # Lint check
          if helm lint ./charts/privacera-base-chart -f "$example" &>/dev/null; then
            echo "  ✅ Lint passed"
          else
            echo "  ❌ Lint failed for $filename"
            helm lint ./charts/privacera-base-chart -f "$example"
            FAILED=$((FAILED + 1))
            continue
          fi
          
          # Template check with output verification
          if helm template test-app ./charts/privacera-base-chart -f "$example" > /tmp/test-$filename.yaml 2>/dev/null; then
            # Verify output contains expected resources
            if grep -q "kind: Deployment\|kind: StatefulSet" /tmp/test-$filename.yaml; then
              echo "  ✅ Template rendered with expected resources"
              PASSED=$((PASSED + 1))
            else
              echo "  ⚠️  Template rendered but missing expected resources"
              FAILED=$((FAILED + 1))
            fi
          else
            echo "  ❌ Template failed for $filename"
            FAILED=$((FAILED + 1))
          fi
          
          echo ""
        done
        
        echo "=============================="
        echo "Test Summary:"
        echo "  ✅ Passed: $PASSED"
        echo "  ❌ Failed: $FAILED"
        echo "  ⏭️  Skipped: $SKIPPED"
        echo "=============================="
        
        if [ $FAILED -gt 0 ]; then
          echo "❌ Some tests failed!"
          exit 1
        else
          echo "🎉 All tests passed!"
        fi

  test-output-comparison:
    name: Test Output Comparison
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.4
    
    - name: Compare all example outputs with expected
      run: |
        echo "🧪 Comparing template outputs with expected results..."
        echo ""
        
        PASSED=0
        FAILED=0
        SKIPPED=0
        
        for example in ./charts/privacera-base-chart/examples/*.yaml; do
          # Skip docs only
          if [[ "$example" == *"README.md" ]] || [[ "$example" == *"TESTING.md" ]]; then
            SKIPPED=$((SKIPPED + 1))
            continue
          fi
          
          filename=$(basename "$example" .yaml)
          expected_file="./charts/privacera-base-chart/examples/expected-outputs/${filename}-expected.yaml"
          
          echo "🔍 Comparing: $filename"
          
          # Check if expected file exists
          if [ ! -f "$expected_file" ]; then
            echo "  ⚠️  No expected output found for $filename"
            FAILED=$((FAILED + 1))
            continue
          fi
          
          # Generate current output
          current_output="/tmp/${filename}-current.yaml"
          if helm template test-app ./charts/privacera-base-chart -f "$example" > "$current_output" 2>/dev/null; then
            echo "  ✅ Template rendered successfully"
          else
            echo "  ❌ Template failed for $filename"
            FAILED=$((FAILED + 1))
            continue
          fi
          
          # Compare outputs
          if diff -u "$expected_file" "$current_output" > /tmp/diff-${filename}.txt; then
            echo "  ✅ Output matches expected"
            PASSED=$((PASSED + 1))
            rm -f /tmp/diff-${filename}.txt
          else
            echo "  ❌ Output differs from expected"
            echo "  📄 Diff summary:"
            echo "    Expected lines: $(wc -l < "$expected_file")"
            echo "    Current lines:  $(wc -l < "$current_output")"
            echo "  📄 Full diff:"
            cat /tmp/diff-${filename}.txt | head -50
            FAILED=$((FAILED + 1))
          fi
          
          echo ""
        done
        
        echo "=============================="
        echo "Output Comparison Summary:"
        echo "  ✅ Passed: $PASSED"
        echo "  ❌ Failed: $FAILED"
        echo "  ⏭️  Skipped: $SKIPPED"
        echo "=============================="
        
        if [ $FAILED -gt 0 ]; then
          echo "❌ Some outputs differ from expected!"
          echo ""
          echo "To update expected outputs, run:"
          echo "  ./scripts/update-expected-outputs.sh"
          exit 1
        else
          echo "🎉 All outputs match expected!"
        fi

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-all-examples, test-output-comparison]
    if: always()
    
    steps:
    - name: Test Results Summary
      run: |
        echo "## 🧪 Helm Chart Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ All example files validated (lint + template)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Template output comparison with expected results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
