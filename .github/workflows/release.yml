name: Release Charts

on:
  push:
    paths:
    - 'charts/**'
  workflow_dispatch:


jobs:
  release:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.4

    - name: Add dependency chart repos
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@v1.6.0
      with:
        charts_dir: charts
        config: .github/cr.yaml
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    - name: Update index.yaml to use GitHub Release URLs
      run: |
        if [ -f ".cr-index/index.yaml" ]; then
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          # Replace GitHub Pages URLs with GitHub Release URLs in index.yaml
          # Pattern: https://owner.github.io/repo/chart-version.tgz -> https://github.com/owner/repo/releases/download/chart-version/chart-version.tgz
          sed -i.bak "s|https://${REPO_OWNER}.github.io/${REPO_NAME}/\([^/]*\)\.tgz|https://github.com/${REPO_OWNER}/${REPO_NAME}/releases/download/\1/\1.tgz|g" .cr-index/index.yaml
          rm -f .cr-index/index.yaml.bak
          cp .cr-index/index.yaml .
        fi

    - name: Commit updated index.yaml
      run: |
        git add index.yaml || true
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: update index.yaml with GitHub Release URLs" || true
          git push || true
        fi
